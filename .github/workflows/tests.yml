name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: offline tests (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    # The shell of a step cannot use the matrix context; the job defaults can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run tests/Invoke-Tests.ps1
        run: ./tests/Invoke-Tests.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PSScriptAnalyzer 1.25.0 and run tools/Invoke-Lint.ps1
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -ErrorAction Stop
          ./tools/Invoke-Lint.ps1 -RequiredVersion 1.25.0
